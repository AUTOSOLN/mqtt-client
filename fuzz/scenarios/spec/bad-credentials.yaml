# CONNECT with a user name and password the server doesn't accept. It
# refuses with CONNACK 0x86 Bad User Name or Password or 0x87 Not authorized
# (3.1.1: 0x04 or 0x05) and closes [MQTT-3.2.2-6/7]. The close step's
# CloseReason has the code; refusal sets the one to require.
version: 5
vars:
  id: fuzz-badcreds-${rand}
  username: fuzz-no-such-user
  password: wrong-password-${rand}
  refusal: 0x86 # 0x04 on 3.1.1
steps:
  - type: connect
    client-id: "${id}"
    username: "${username}"
    password: "${password}"
  - label: refused and closed
    type: expect-close
    timeout: 5s
    reason: ${refusal}
