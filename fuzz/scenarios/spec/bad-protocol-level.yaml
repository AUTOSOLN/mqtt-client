# CONNECT with protocol level 6, which no MQTT version uses. The server
# answers CONNACK 0x01 (3.1.1, required [MQTT-3.1.2-2]) or 0x84 (MQTT 5,
# optional), then closes. The close step's CloseReason has the refusal code,
# if one came.
version: 5
vars:
  id: fuzz-level-${rand}
steps:
  - type: connect
    client-id: "${id}"
    protocol-level: 6
  - label: refused and closed
    type: expect-close
    timeout: 5s
