# PUBREL with fixed-header flags 0000 instead of the required 0010
# [MQTT-2.1.3-1]: a Malformed Packet, so the server closes (MQTT 5:
# DISCONNECT 0x81 first).
version: 5
vars:
  id: fuzz-pubrel-${rand}
steps:
  - type: connect
    client-id: "${id}"
  - type: recv
    expect: connack
    reason: 0
  - label: PUBREL with flags 0000
    type: pubrel
    packet-id: 1
    flags: 0
  - label: closed
    type: expect-close
    timeout: 5s
